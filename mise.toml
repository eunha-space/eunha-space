[tools]
node = "lts"
pnpm = "11.9.0"
rust = "latest"

[tasks.dev]
run = "cargo run"

[tasks.frontend]
run = "cd frontend && pnpm install --frozen-lockfile && pnpm run build"

[tasks.build]
depends = ["frontend"]
run = "cargo build --release"

[tasks.temporal]
description = "Run the local Temporal service used for workflow development"
run = "docker compose --env-file ops/temporal/.env.dev -f ops/temporal/docker-compose.dev.yml up"
