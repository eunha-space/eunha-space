<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/eunha-symbol-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/eunha-symbol-dark.svg" media="(prefers-color-scheme: dark)" />
    <title>eunha space</title>
    <meta name="description" content="eunha space hosts Eunha, a Mastodon-compatible fediverse server. Choose an address and have a server of your own, without running one." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eunha.space/" />
    <meta property="og:title" content="eunha space" />
    <meta property="og:description" content="eunha space hosts Eunha, a Mastodon-compatible fediverse server. Choose an address and have a server of your own, without running one." />
    <script>
      // Resolve the theme before first paint so the console never flashes the wrong one.
      try {
        var stored = localStorage.theme;
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (_) {}
      // The customer pages need the language and the session before they can
      // say anything. Asking now runs those requests alongside the download of
      // the script, rather than one after the other once it has started.
      if (!location.pathname.startsWith("/admin")) {
        var ask = function (path) {
          return fetch(path, { credentials: "same-origin" }).then(function (response) {
            return response.json().then(
              function (body) { return { ok: response.ok, status: response.status, body: body }; },
              function () { return { ok: response.ok, status: response.status, body: null }; }
            );
          });
        };
        window.__boot = {
          locale: ask("/api/customer/locale"),
          me: ask("/api/customer/session/me"),
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>eunha space hosts Eunha, a Mastodon-compatible fediverse server. Choose an address and have a server of your own, without running one.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
