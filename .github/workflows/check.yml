name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      CARGO_BUILD_JOBS: "2"
      PG_BIN: /usr/lib/postgresql/18/bin
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: System build dependencies
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler postgresql-18
      - name: Rust formatting component
        run: mise exec -- rustup component add rustfmt
      - name: Rust formatting and unit tests
        run: |
          mise exec -- cargo fmt --check
          mise exec -- cargo test
      - name: PostgreSQL failure and concurrency tests
        run: mise run test-integration
      - name: Ops script tests
        run: mise run test-ops
      - name: Frontend
        run: mise run frontend

  # The release a deploy activates, built for the Apple Silicon host rather
  # than on it, and only for a commit whose checks passed. A deploy finds the
  # artifact through this workflow's run for the commit.
  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: System build dependencies
        run: brew install protobuf
      - uses: Swatinem/rust-cache@v2
      - name: Frontend
        run: mise run frontend
      - name: Build the control plane
        run: mise exec -- cargo build --release --locked
      # Anything outside the OS would have to be installed on the host at the
      # same version.
      - name: Links nothing but the system
        run: |
          otool -L target/release/eunha-space
          if otool -L target/release/eunha-space | tail -n +2 \
            | grep -Ev '^[[:space:]]+/(usr/lib|System/Library)/'; then
            echo "::error::eunha-space links a library the host may not have"
            exit 1
          fi
      # A tarball because the artifact's zip drops the executable bit. The
      # runtime router helper goes with it: the control plane hands it to every
      # runtime release it rolls out.
      - name: Package
        run: |
          mkdir -p package/frontend package/ops
          cp target/release/eunha-space package/
          cp -R frontend/dist package/frontend/
          cp ops/eunha-runtime-router package/ops/
          tar -czf eunha-space-macos-arm64.tar.gz -C package eunha-space frontend ops
      - uses: actions/upload-artifact@v4
        with:
          name: eunha-space-macos-arm64
          path: eunha-space-macos-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
