name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      CARGO_BUILD_JOBS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Rust formatting component
        run: mise exec -- rustup component add rustfmt
      - name: Rust formatting and unit tests
        run: |
          mise exec -- cargo fmt --check
          mise exec -- cargo test
      - name: PostgreSQL failure and concurrency tests
        run: mise run test-integration
      - name: Deployment recovery tests
        run: mise run test-deploy
      - name: Frontend
        run: mise run frontend
