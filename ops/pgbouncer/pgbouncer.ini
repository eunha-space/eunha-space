;; Eunha tenant connection pooler.
;;
;; Every tenant has its own role and database, so a pool here is per tenant and
;; nothing is shared between them. What it buys is time: a tenant holds a real
;; PostgreSQL backend only while a transaction is in flight, so the backend
;; count follows concurrent work rather than tenant count.

[databases]
;; Any tenant database, without naming them: provisioning creates them freely.
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /tmp

pool_mode = transaction
;; sqlx caches prepared statements per connection; without this they would be
;; lost the moment a server connection moved to another client.
max_prepared_statements = 200

;; Roles come and go with tenants, so they are looked up in PostgreSQL rather
;; than listed in a file. The client still proves its password, which localhost
;; trust in pg_hba does not currently ask for.
auth_type = scram-sha-256
auth_user = limeburst
auth_dbname = postgres
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

max_client_conn = 10000
;; Server connections per tenant. Tenant pools are 2-3 clients, and those
;; clients are idle almost always, so this is a ceiling rather than a target.
default_pool_size = 3
min_pool_size = 0
max_db_connections = 5
;; An idle tenant should hold nothing.
server_idle_timeout = 30
server_lifetime = 3600

logfile = /opt/homebrew/var/log/pgbouncer.log
pidfile = /opt/homebrew/var/run/pgbouncer.pid
admin_users = limeburst

;; sqlx sends these at startup and PgBouncer rejects unknown ones outright;
;; without this every tenant fails to connect with "unsupported startup
;; parameter". They carry no session state worth preserving here.
ignore_startup_parameters = extra_float_digits,options,search_path
