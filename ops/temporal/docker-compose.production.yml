# Production Temporal Server. Deploy with an untracked .env.production file
# containing POSTGRES_PWD; the database is the host's loopback PostgreSQL.
services:
  schema:
    image: temporalio/admin-tools:1.29.7-tctl-1.18.4-cli-1.7.2
    restart: "no"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${POSTGRES_PWD:?required}
      POSTGRES_SEEDS: host.docker.internal
      SQL_PASSWORD: ${POSTGRES_PWD:?required}
    entrypoint: ["/bin/sh", "-e"]
    command: ["/scripts/setup-postgres.sh"]
    volumes:
      - ./setup-postgres.sh:/scripts/setup-postgres.sh:ro

  temporal:
    image: temporalio/server:1.29.7
    restart: unless-stopped
    depends_on:
      schema:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${POSTGRES_PWD:?required}
      POSTGRES_SEEDS: host.docker.internal
      BIND_ON_IP: 0.0.0.0
      # This host shares PostgreSQL with the control plane and tenant runtimes.
      SQL_MAX_CONNS: 8
      SQL_MAX_IDLE_CONNS: 8
      SQL_VIS_MAX_CONNS: 4
      SQL_VIS_MAX_IDLE_CONNS: 4
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  namespace:
    image: temporalio/admin-tools:1.29.7-tctl-1.18.4-cli-1.7.2
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh", "-ec"]
    command: ["temporal --address \"$${TEMPORAL_ADDRESS}\" operator namespace describe -n eunha-space >/dev/null 2>&1 || temporal --address \"$${TEMPORAL_ADDRESS}\" operator namespace create -n eunha-space --retention 30d"]

  ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8080:8080"
      - "100.113.148.66:8080:8080"
